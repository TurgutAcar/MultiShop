version: '3.8'
services:
   catalogdb:
      container_name: catalogdb
      restart: always
      ports:
        - "27017:27017"
      volumes:
        - catalogdb_volume:/data/db
      deploy:
      placement:
        constraints: [node.role == manager]
   basketdb:
      container_name: basketdb
      restart: always
      ports:
        - "6379:6379"  
   discountdb:
      container_name: discountdb
      restart: always
      ports:
        - "1443:1433"
      volumes:
        - discountdb_volume:/var/opt/mssql
      environment:
        - ACCEPT_EULA=Y
        - SA_PASSWORD=123456aA*
   identitydb:
      container_name: identitydb
      restart: always
      ports:
        - "1433:1433"
      volumes:
        - identitydb_volume:/var/opt/mssql
      environment:
        - ACCEPT_EULA=Y
        - SA_PASSWORD=123456aA*
   orderdb:
      container_name: orderdb
      restart: always
      ports:
        - "1440:1433"
      volumes:
        - orderdb_volume:/var/opt/mssql
      environment:
        - ACCEPT_EULA=Y
        - SA_PASSWORD=123456aA*
   catalogapi:
     container_name: catalogapi
     environment:
     - ASPNETCORE_ENVIRONMENT=Development
     - ASPNETCORE_URLS=http://+:80
     - IdentityServerUrl=http://identityserverapi:80
     - DatabaseSettings__ConnectionString=mongodb://catalogdb:27017
     ports:
      - "7070:80"
     depends_on:
      - catalogdb
      - identityserverapi
     deploy:
      replicas: 2
      restart_policy:
        condition: any
   gatewayapi:
    container_name: gatewayapi
    environment:
     - ASPNETCORE_ENVIRONMENT=Production
     - ASPNETCORE_URLS=http://+:80
     - IdentityServerUrl=http://identityserverapi:80
    ports:
      - "5000:80"
    depends_on:
      - identityserverapi
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.role == manager]
   identityserverapi:
    container_name: identityserverapi
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=identitydb,1433;Database=IdentityDb;User=sa;Password=123456aA*;Encrypt=False;TrustServerCertificate=True;
    ports:
      - "5001:80"
    volumes:
      - ./data-protection-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - identitydb
    